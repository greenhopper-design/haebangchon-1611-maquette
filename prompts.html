<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Render Prompts — 세 시간의 집 (해방촌 16-11)</title>
<style>
:root { --ink: #1f2328; --mute: #6b7783; --red: #d7263d; --line: #e4e2dd; --bg: #f4f3f0; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Pretendard", "Malgun Gothic", system-ui, sans-serif; }
header { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 14px 28px; background: rgba(255, 255, 255, .94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; font-size: 15px; } .brand i { width: 10px; height: 10px; background: var(--red); display: inline-block; }
.brand small { color: var(--mute); }
nav a, .pill { all: unset; cursor: pointer; padding: 7px 13px; border-radius: 999px; border: 1px solid var(--line); font-size: 13px; background: #fff; }
nav { display: flex; gap: 8px; flex-wrap: wrap; } nav a.dark, .pill.dark { background: var(--ink); color: #fff; border-color: var(--ink); }
main { max-width: 1280px; margin: 0 auto; padding: 26px 28px 80px; }
.hero { padding: 26px 0 8px; } .hero h1 { margin: 0 0 8px; font-size: 34px; letter-spacing: -.01em; }
.hero p { margin: 4px 0; color: #3b434b; line-height: 1.6; max-width: 820px; }
.steps { display: flex; gap: 10px; flex-wrap: wrap; margin: 16px 0 6px; } .steps span { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 13px; }
.steps b { color: var(--red); margin-right: 6px; }
h2 { margin: 34px 0 14px; font-size: 20px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 18px; }
.card { background: #fff; border-radius: 14px; overflow: hidden; box-shadow: 0 1px 5px rgba(0, 0, 0, .06); display: flex; flex-direction: column; }
.card .ph { position: relative; aspect-ratio: 16/9; background: #e8e6e1; } .card .ph img, .card .ph video { width: 100%; height: 100%; object-fit: cover; display: block; }
.card .no { position: absolute; left: 10px; top: 10px; background: rgba(255, 255, 255, .92); border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 600; }
.card .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
.card h3 { margin: 0; font-size: 16px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; align-self: flex-start; }
.seg button { all: unset; cursor: pointer; padding: 5px 12px; font-size: 12px; } .seg button.on { background: var(--ink); color: #fff; }
.seg button small { opacity: .7; }
pre { margin: 0; white-space: pre-wrap; word-break: break-word; font: 12px/1.55 ui-monospace, Consolas, monospace; background: #f6f6f4; border: 1px solid #eceae6; border-radius: 10px; padding: 10px 12px; max-height: 190px; overflow: auto; color: #2b3137; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; }
.btn { all: unset; cursor: pointer; padding: 8px 14px; border-radius: 999px; font-size: 13px; border: 1px solid var(--line); }
.btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
.btn:focus-visible, .seg button:focus-visible, nav a:focus-visible, .pill:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
.wide { grid-column: 1 / -1; } .wide .ph { aspect-ratio: 21/9; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); opacity: 0; background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 13px; transition: .25s; pointer-events: none; }
.toast.show { opacity: 1; transform: translateX(-50%); }
footer { color: var(--mute); font-size: 12px; text-align: center; padding: 30px; }
@media (max-width: 600px) { .grid { grid-template-columns: 1fr; } header, main { padding-left: 16px; padding-right: 16px; } .hero h1 { font-size: 26px; } }
</style>
</head>
<body>
<header>
  <div class="brand"><i></i><b>Render Prompts</b><small>세 시간의 집 · 해방촌 16-11</small></div>
  <nav aria-label="바로가기"><a href="#photos">사진 15</a><a href="#video">영상</a><button class="pill" id="copyKeep">형태 고정 재요청 문장 복사</button><a class="dark" href="./">3D 모형 보기 →</a></nav>
</header>
<main>
  <section class="hero">
    <h1>GPT로 렌더링할 사진 · 영상 프롬프트</h1>
    <p>라이노 모델에서 뽑은 흰 클레이·선 베이스 이미지입니다. 이미지를 받아 ChatGPT에 올리고, 같은 카드의 프롬프트를 복사해 붙여 넣으세요.</p>
    <div class="steps"><span><b>1</b>베이스 이미지 받기</span><span><b>2</b>ChatGPT에 이미지 올리기</span><span><b>3</b>프롬프트 복사 · 붙여넣기</span><span><b>4</b>형태가 바뀌면 '형태 고정 문장' 추가</span></div>
  </section>
  <h2 id="photos">사진 — 15장</h2>
  <div class="grid" id="shotGrid"></div>
  <h2 id="video">영상</h2>
  <div class="grid" id="videoGrid"></div>
</main>
<footer>학습용 계획안 — AI도시건축디자인 · 김세진 · 2026.11</footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const DATA = {"fix": "Use the uploaded image as an exact geometric base. Keep the camera, perspective, composition and every architectural element (walls, slabs, arches, window mullions, stair, courtyard, terrace) exactly where they are. Do not add floors or change proportions. The building is a 3-storey courtyard house on a small sloped plot in Haebangchon, Seoul, below Namsan: exposed white concrete, two street arches on the ground floor (a neighbourhood self-laundry and a parking pilotis), a small open-to-sky courtyard with one tree, a 3rd-floor front terrace with planters. Window frames are drawn without glass: fill every frame with clear glass. TREES: every GREEN ball on a thin BROWN stick in the image is a TREE placeholder (one in the courtyard, two in the back garden). Render each one as a real living deciduous tree (e.g. a Korean zelkova or Japanese maple) with an irregular, airy leaf canopy and branches, about the same size and position. They are NOT walls, columns, spheres or solid volumes, and must not merge with the building.", "styles": {"board": "Style: architecture competition board drawing. White and pale-grey line drawing on off-white paper, fine black hatch lines, stippled dot texture on ground and roofs, context buildings as light grey outlines, trees as loose hand-sketched canopies with dot shading, the project's cut edges, frames and railings highlighted in deep crimson red (#9E1B1F), tiny sketched people in pale colours, a few birds. Not photorealistic. Crisp, high resolution, 16:9.", "photo": "Style: photorealistic architectural visualisation, late-afternoon autumn sun from the southwest, soft shadows, white board-marked concrete, dark steel window frames, warm interior light, people in everyday Seoul clothing, Haebangchon hillside alley atmosphere, 35 mm lens look, high resolution."}, "shots": [{"no": "01", "title": "아이소 전경", "style": "board", "scene": "Isometric general view of the house within the dense Haebangchon block, seen from above the street. Small caption bottom-left: 'ISOMETRIC — HAEBANGCHON 16-11'. People at the laundry arch and on the street, a delivery scooter, birds above the courtyard.", "png": "01_A1_iso_general_line.png", "jpg": "01_A1_iso_general_line.jpg"}, {"no": "02", "title": "아이소 전경 (클레이 베이스)", "style": "board", "scene": "Same isometric general view. Render the white clay massing as a fine line drawing; keep the neighbourhood buildings very light so the house stands out in crimson accents.", "png": "02_A1_iso_general_clay.png", "jpg": "02_A1_iso_general_clay.jpg"}, {"no": "03", "title": "1층 아이소 컷", "style": "board", "scene": "Cutaway isometric at ground-floor level: the self-laundry with stacked washing machines and a waiting bench, the parking pilotis with one small car, the entrance hall with a spiral stair, the courtyard tree, the parents' bedroom and bathroom at the back. Cut walls filled solid crimson.", "png": "03_A2_iso_cut_1F.png", "jpg": "03_A2_iso_cut_1F.jpg"}, {"no": "04", "title": "2층 아이소 컷", "style": "board", "scene": "Cutaway isometric at the 2nd floor: master bedroom and child's bedroom at the front, a glazed corridor wrapping the courtyard, a small family room, bathroom with washer, second child's room at the back. Cut walls crimson, furniture as light line drawing, a child reading.", "png": "04_A2_iso_cut_2F.png", "jpg": "04_A2_iso_cut_2F.jpg"}, {"no": "05", "title": "3층 아이소 컷", "style": "board", "scene": "Cutaway isometric at the 3rd floor: open living-dining room facing the front terrace, kitchen along the back wall looking into the courtyard, small WC, a family at the dining table. Cut walls crimson.", "png": "05_A2_iso_cut_3F.png", "jpg": "05_A2_iso_cut_3F.jpg"}, {"no": "06", "title": "단면투시 A", "style": "board", "scene": "Sectional perspective through the laundry, the open courtyard and the back rooms. Cut slabs and walls in solid crimson; rooms behind drawn in fine lines with furniture and people (someone folding laundry on the ground floor, a child at a desk on the 2nd floor, a family eating on the 3rd floor). The courtyard tree rises through three storeys. Dashed level lines on the left with small level tags ±0, +3.8, +7.5.", "png": "06_S1_section_persp_A.png", "jpg": "06_S1_section_persp_A.jpg"}, {"no": "07", "title": "단면투시 B", "style": "board", "scene": "Cross-section perspective through the spiral stair, the entrance hall and the courtyard. Crimson cut; afternoon sunlight falling into the courtyard down to the ground floor; neighbours' walls as light outlines.", "png": "07_S2_section_persp_B.png", "jpg": "07_S2_section_persp_B.jpg"}, {"no": "08", "title": "신흥로 가로 투시", "style": "photo", "scene": "Eye-level street view from across Sinheung-ro: the two concrete arches lit warmly from inside, neighbours chatting at the laundry, a small car parked under the left arch, hillside alley houses around, early evening.", "png": "08_E1_street_eye.png", "jpg": "08_E1_street_eye.jpg"}, {"no": "09", "title": "실내: 빨래방 → 중정", "style": "photo", "scene": "Interior of the small neighbourhood self-laundry: stacked white washers and dryers on the right, a timber counter, a view through the glass wall into the green courtyard, an elderly neighbour waiting, warm afternoon light.", "png": "09_I1_laundromat_to_court.png", "jpg": "09_I1_laundromat_to_court.jpg"}, {"no": "10", "title": "실내: 현관홀 · 중정", "style": "photo", "scene": "Entrance hall: a steel lattice screen and full-height glass toward the courtyard tree, the edge of a white spiral stair, polished concrete floor, a low bench with shoes.", "png": "10_I2_hall_court_stair.png", "jpg": "10_I2_hall_court_stair.jpg"}, {"no": "11", "title": "실내: 2층 중정 복도", "style": "photo", "scene": "Narrow corridor on the 2nd floor with full-height glazing to the courtyard on one side and bedroom doors on the other, children's drawings on the wall, soft daylight from the courtyard.", "png": "11_I3_2F_gallery_corridor.png", "jpg": "11_I3_2F_gallery_corridor.jpg"}, {"no": "12", "title": "실내: 3층 거실 → 테라스", "style": "photo", "scene": "3rd-floor living-dining room opening to the front terrace through glass sliding doors; oak dining table, linen sofa, planters outside and the Haebangchon roofscape and Namsan beyond.", "png": "12_I4_3F_living_terrace.png", "jpg": "12_I4_3F_living_terrace.jpg"}, {"no": "13", "title": "실내: 3층 주방 → 중정", "style": "photo", "scene": "Kitchen along the back wall with a long counter and a window band above, looking across into the open courtyard; a family cooking together, evening light.", "png": "13_I5_3F_kitchen_court.png", "jpg": "13_I5_3F_kitchen_court.jpg"}, {"no": "14", "title": "중정 올려보기", "style": "photo", "scene": "Worm's-eye view from the courtyard floor up through three storeys of glass and concrete to a square of blue sky, the tree canopy in the middle, leaves catching the sun.", "png": "14_I6_court_lookup.png", "jpg": "14_I6_court_lookup.jpg"}, {"no": "15", "title": "실내: 1층 부모님 방 → 중정", "style": "photo", "scene": "Ground-floor bedroom for elderly parents: a single bed with light bedding, a door to the hall, full glass toward the courtyard tree, calm morning light.", "png": "15_I7_1F_room_court.png", "jpg": "15_I7_1F_room_court.jpg"}], "cuts": [{"no": "01", "title": "조감 회전", "move": "Slow aerial orbit around the house from the street side, the dense hillside neighbourhood around it, birds crossing.", "png": "cut01_s0_0000.png", "jpg": "cut01_s0_0000.jpg"}, {"no": "02", "title": "신흥로 진입", "move": "Walking forward along Sinheung-ro toward the two arches, neighbours passing, warm light inside the laundry.", "png": "cut02_s1_0000.png", "jpg": "cut02_s1_0000.jpg"}, {"no": "03", "title": "현관홀", "move": "Standing in the entrance hall, the camera pans from the spiral stair to the glass wall and the courtyard tree.", "png": "cut03_s2_0000.png", "jpg": "cut03_s2_0000.jpg"}, {"no": "04", "title": "중정 상승", "move": "The camera rises slowly inside the open courtyard past three storeys of glass, leaves moving in the breeze.", "png": "cut04_s3_0000.png", "jpg": "cut04_s3_0000.jpg"}, {"no": "05", "title": "3층 거실 → 테라스", "move": "Moving through the 3rd-floor living room toward the terrace, the view opens to the Haebangchon rooftops and Namsan.", "png": "cut05_s4_0000.png", "jpg": "cut05_s4_0000.jpg"}, {"no": "06", "title": "조감 마무리", "move": "Aerial pull-away around the house at dusk, windows lighting up one by one.", "png": "cut06_s5_0000.png", "jpg": "cut06_s5_0000.jpg"}], "videoA": "Restyle this clay walkthrough of a 3-storey white-concrete courtyard house in Haebangchon, Seoul. Keep the exact camera motion, timing and geometry. The green ball on a brown stick is a tree placeholder: turn it into a real leafy deciduous tree, never a wall or solid volume. Photorealistic, late-afternoon autumn light, gentle people movement, leaves moving in the courtyard tree, washing machines spinning in the ground-floor laundry, soft cinematic grade.", "keep": "Keep every wall, window and arch exactly where it is in the uploaded image. Only change materials, light, people and drawing style. The green balls on brown sticks are trees: draw them as real leafy trees, not walls."};
const STY = { board: "보드 (레퍼런스)", photo: "포토리얼" };
const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
const toast = (t) => { const el = document.getElementById("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 1600); };
async function copy(text, label) {
  try { await navigator.clipboard.writeText(text); }
  catch { const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
  toast(label + " 복사됨");
}
const shotPrompt = (s, sty) => [DATA.fix, s.scene, DATA.styles[sty]].join("\n\n");
const cutPrompt = (c, sty) => [DATA.fix, DATA.styles[sty], `Animate for 4 seconds: ${c.move} Smooth, steady camera, no cuts.`].join("\n\n");

function card({ no, title, jpg, png, rec, build, wide, video }) {
  const el = document.createElement("article"); el.className = "card" + (wide ? " wide" : "");
  const media = video ? `<video src="assets/walkthrough_clay.mp4" muted loop autoplay playsinline></video>` : `<img src="prompts/${jpg}" alt="${esc(title)} 베이스" loading="lazy">`;
  el.innerHTML = `<div class="ph">${media}<span class="no">${no}</span></div><div class="body"><h3>${esc(title)}</h3>
    ${rec ? `<div class="seg" role="group" aria-label="스타일">${Object.keys(STY).map((k) => `<button data-s="${k}" class="${k === rec ? "on" : ""}">${STY[k]}${k === rec ? " <small>추천</small>" : ""}</button>`).join("")}</div>` : ""}
    <pre></pre><div class="btns"><button class="btn primary" data-copy>프롬프트 복사</button>
    ${video ? `<a class="btn" href="assets/walkthrough_clay.mp4" download>영상 받기</a>` : `<a class="btn" href="prompts/${png}" download>베이스 이미지 받기</a>`}</div></div>`;
  let sty = rec;
  const pre = el.querySelector("pre"), render = () => (pre.textContent = build(sty));
  el.querySelectorAll(".seg button").forEach((b) => b.addEventListener("click", () => { sty = b.dataset.s; el.querySelectorAll(".seg button").forEach((x) => x.classList.toggle("on", x === b)); render(); }));
  el.querySelector("[data-copy]").addEventListener("click", () => copy(pre.textContent, `${no} 프롬프트`));
  render(); return el;
}
const sg = document.getElementById("shotGrid");
DATA.shots.forEach((s) => sg.appendChild(card({ no: s.no, title: s.title, jpg: s.jpg, png: s.png, rec: s.style, build: (st) => shotPrompt(s, st) })));
const vg = document.getElementById("videoGrid");
vg.appendChild(card({ no: "A", title: "통영상 → 영상 (클레이 워크스루 19.5초를 그대로 다시 칠하기)", wide: true, video: true, build: () => DATA.videoA }));
DATA.cuts.forEach((c) => vg.appendChild(card({ no: "컷 " + c.no, title: `${c.title} — 첫 프레임 렌더 → 이미지→영상 4초`, jpg: c.jpg, png: c.png, rec: "photo", build: (st) => cutPrompt(c, st) })));
document.getElementById("copyKeep").addEventListener("click", () => copy(DATA.keep, "형태 고정 문장"));
</script>
</body>
</html>
